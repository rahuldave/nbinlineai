[build-system]
requires = ["hatchling>=1.26", "hatch-jupyter-builder>=0.9", "jupyterlab>=4.2,<5"]
build-backend = "hatchling.build"

[project]
name = "nbinlineai"
version = "0.1.14"
description = "Inline AI prompt cells for JupyterLab notebooks with OpenAI and Anthropic"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
keywords = ["jupyterlab", "notebooks", "education", "ai", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "Framework :: Jupyter :: JupyterLab :: Extensions",
  "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
  "jupyterlab>=4.2,<5",
  "jupyter_server>=2,<3",
  "python-fastllm==0.0.63",
  "openai-codex==0.156.1; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')) or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64'))",
  "argon2-cffi-bindings<26.1.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "argon2-cffi-bindings>=26.1.0; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')) or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64'))",
  "fastcore>=2.2.30,<3",
  "pathspec>=1.1.1,<2",
  "markdown-it-py>=4.2,<5",
  "pyskills>=0.0.33,<0.1",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1,<2",
  "filelock>=3.32,<4",
  "comm>=0.2,<1",
  "ipykernel>=6.18",
]

[project.urls]
Repository = "https://github.com/rahuldave/nbinlineai"
Documentation = "https://rahuldave.com/nbinlineai/"
Issues = "https://github.com/rahuldave/nbinlineai/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.sdist]
artifacts = ["nbinlineai/labextension"]
only-include = [
  "LICENSE", "README.md", "pyproject.toml", "uv.lock", "package.json", "yarn.lock",
  ".yarnrc.yml", "tsconfig.json", "install.json", "nbinlineai", "jupyter-config",
  "src", "style", "schema", "tests", "examples", "docs", "playwright.config.ts",
]
exclude = [
  ".venv", "node_modules", "lib", "dist", ".env", ".env.*", "internal_docs",
  "test-results", "playwright-report", ".pytest_cache", ".ruff_cache", ".git",
  "*.egg-info", "**/__pycache__", "**/*.pyc", ".DS_Store",
]

[tool.hatch.build.targets.wheel]
packages = ["nbinlineai"]

[tool.hatch.build.targets.wheel.shared-data]
"nbinlineai/labextension" = "share/jupyter/labextensions/nbinlineai"
"install.json" = "share/jupyter/labextensions/nbinlineai/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
"docs" = "share/doc/nbinlineai/docs"
"examples" = "share/doc/nbinlineai/examples"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["nbinlineai/labextension/package.json"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# AI Markdown references consume these imports outside ordinary Python cells.
"examples/*.ipynb" = ["F401"]

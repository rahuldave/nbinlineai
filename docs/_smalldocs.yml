project:
  type: website
  output-dir: _site
  render:
    - '*.md'
    - 'manual/*.md'
    - 'api/*.qmd'
    - 'notebooks/**/*.ipynb'
  resources:
    - .nojekyll
    - images/**
    - assets/themes/litera-reading/**

website:
  title: nbinlineai
  description: AI prompts in JupyterLab notebooks
  site-url: https://rahuldave.com/nbinlineai/
  repo-url: https://github.com/rahuldave/nbinlineai
  navbar:
    left:
      - text: Home
        href: index.md
      - text: User guide
        href: user-guide.md
      - text: Tool catalog
        href: tools.md
      - text: Tool API
        href: tool-api.md
      - text: Notebook examples
        href: examples.md
      - text: FAQ
        href: faq.md
      - text: Architecture
        href: architecture.md
      - text: Prior art
        href: prior-art.md
      - text: Development
        href: development.md

theme: litera
css:
  - assets/themes/litera-reading/litera-reading.css
  - assets/css/site.css
toc: true
code-copy: true

api:
  packages:
    - nbinlineai.tools
    - nbinlineai.fastcore_tools
    - nbinlineai.notebook_tools
    - nbinlineai.source_tools
    - nbinlineai.inspection_tools
    - nbinlineai.execution_tools
    - nbinlineai.web_tools
    - nbinlineai.browser_media_tools
    - nbinlineai.browser_output_tools
    - nbinlineai.browser_capture_tools
    - nbinlineai.browser_playback_tools
    - nbinlineai.browser_transform_tools
    - nbinlineai.browser_attachment_tools
  root: ..
  out: api
  source: https://github.com/rahuldave/nbinlineai/blob/main

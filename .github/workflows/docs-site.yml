name: Documentation site

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: documentation-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Main's ruleset requires this exact legacy context; the renderer below is smalldocs.
    name: Render and check Quarto site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked documentation and API import dependencies
        run: uv sync --frozen --group dev --no-install-project --no-build --python 3.12
      - name: Check tool Docments coverage
        run: uv run --no-sync smalldocs api check --dir docs
      - name: Render documentation
        run: uv run --no-sync python scripts/build_docs_site.py
      - name: Check pages, notebook gallery, tool tables, and local links
        run: python3 scripts/check_docs_site.py docs/_site
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    name: Publish documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
